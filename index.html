<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상하이 여행</title>
<meta name="description" content="2026.10.31 – 11.3 상하이 여행 일정 · 정산 · 기록">
<meta name="theme-color" content="#0A0E2E" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="상하이">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<script>
/* pick 낮/밤 before first paint: default is by time (밤 6시 ~ 아침 6시 = 밤) */
(function () {
  var m = "time";
  try { m = (JSON.parse(localStorage.getItem("sht.ui.v1")) || {}).theme || "time"; } catch (e) {}
  var h = new Date().getHours(), dark;
  if (m === "dark") dark = true;
  else if (m === "light") dark = false;
  else if (m === "system") dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  else dark = h >= 18 || h < 6;
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  document.getElementById("themeColor").setAttribute("content", dark ? "#0A0E2E" : "#2A63C4");
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@900&text=%E4%B8%8A%E6%B5%B7&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="view" class="view"></main>

<nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
  <button type="button" data-act="tab" data-tab="home"><span class="ti" data-icon="home"></span><span>홈</span></button>
  <button type="button" data-act="tab" data-tab="plan"><span class="ti" data-icon="map"></span><span>일정</span></button>
  <button type="button" data-act="tab" data-tab="log"><span class="ti" data-icon="log"></span><span>기록</span></button>
  <button type="button" data-act="tab" data-tab="money"><span class="ti" data-icon="money"></span><span>정산</span></button>
  <button type="button" data-act="tab" data-tab="more"><span class="ti" data-icon="more"></span><span>더보기</span></button>
</nav>

<div class="sheet" id="sheet" hidden></div>

<div class="taxi" id="taxi" hidden role="dialog" aria-modal="true" aria-label="기사님께 보여주기">
  <div class="taxi-top">
    <button class="btn" type="button" data-act="taxi-copy">중국어 복사</button>
    <button class="btn" type="button" data-act="taxi-close">닫기</button>
  </div>
  <div class="taxi-body">
    <div class="taxi-zh" id="taxiZh"></div>
    <div class="taxi-addr" id="taxiAddr"></div>
    <div class="taxi-please">请带我去这里，谢谢</div>
    <div class="taxi-ko" id="taxiKo"></div>
  </div>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="viewer-top">
    <button class="btn" type="button" data-act="viewer-prev" aria-label="이전 사진">‹</button>
    <span class="viewer-count" id="viewerCount"></span>
    <button class="btn" type="button" data-act="viewer-next" aria-label="다음 사진">›</button>
    <span class="grow"></span>
    <button class="btn danger" type="button" data-act="viewer-del" id="viewerDel">지우기</button>
    <button class="btn" type="button" data-act="viewer-close">닫기</button>
  </div>
  <div class="viewer-body"><img id="viewerImg" alt="" referrerpolicy="no-referrer"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
